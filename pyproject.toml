[project]
name = "federal-register-study"
version = "0.1.0"
description = "Analysis pipeline for Federal Register public comments - fetches documents, mines comments, classifies authors, and generates visualizations"
readme = "README.md"
requires-python = ">=3.10"
license = {text = "MIT"}
authors = [
    {name = "Praneel Patel"}
]
keywords = ["federal-register", "regulations", "public-comments", "nlp", "policy"]

dependencies = [
    # Core data processing
    "pandas>=2.0.0",
    "polars>=0.19.0",
    "numpy>=1.24.0",
    
    # HTTP requests and API calls
    "requests>=2.31.0",
    
    # Progress bars
    "tqdm>=4.66.0",
    
    # Machine learning and clustering
    "scikit-learn>=1.3.0",
    "gensim>=4.3.0",
    
    # Embeddings for deduplication
    "sentence-transformers>=2.2.0",
    "torch>=2.0.0",
    
    # OpenAI API
    "openai>=1.0.0",
    
    # Visualization
    "matplotlib>=3.7.0",
    
    # PDF extraction
    "pypdf>=3.0.0",
    "PyMuPDF>=1.23.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[project.scripts]
federal-register = "stratification_scripts.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["stratification_scripts"]

[tool.uv]
dev-dependencies = [
    "pytest>=7.0.0",
    "pytest-asyncio>=0.21.0",
    "ruff>=0.1.0",
    "mypy>=1.0.0",
]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]  # Line length handled separately

[tool.mypy]
python_version = "3.10"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true

